<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrameOptimizer</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6573; --border: #dde1e7;
      --accent: #d13639; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn-text: #7a5300;
      --error-bg: #fde7e7; --error-text: #9b1c1c; --bar: #d13639; --code-bg: #f0f2f5;
      --grid: #e6e9ee;
      /* Chart series colors (validated colorblind-safe set): one fixed color per engine part. */
      --s-game: #1baf7a; --s-render: #eb6834; --s-gpu: #2a78d6; --s-frame: #16181d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa3b2; --border: #2c313a;
        --accent: #ff5a5f; --accent-text: #111317; --warn-bg: #3a2f10; --warn-text: #ffd27a;
        --error-bg: #3d1717; --error-text: #ffb3b3; --bar: #ff5a5f; --code-bg: #232730;
        --grid: #262a32;
        --s-game: #199e70; --s-render: #d95926; --s-gpu: #3987e5; --s-frame: #e8eaee;
      }
    }
    * { box-sizing: border-box; }
    /* Compact layout: built to sit in a narrow window beside the running game. */
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { margin: 0 auto; padding: 8px 10px 16px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 6px; }
    .topbar .run { margin: 0 0 0 auto; }
    h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; cursor: default; }
    h1 span { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; margin-bottom: 8px; }
    .card h2 { margin: 0 0 6px; font-size: 13px; }
    .card h3 { margin: 10px 0 4px; font-size: 12px; }
    label { display: block; font-weight: 600; font-size: 12px; margin: 6px 0 3px; }
    label:first-of-type { margin-top: 0; }
    textarea { resize: vertical; }
    input, textarea { width: 100%; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font: inherit; }
    .hint { color: var(--muted); font-size: 11px; margin: 3px 0 0; }
    button { margin-top: 8px; padding: 5px 12px; border: 0; border-radius: 6px; background: var(--accent);
             color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--code-bg); }
    .tabs button { margin: 0; padding: 3px 10px; background: transparent; color: var(--muted); font-weight: 600; }
    .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .running { margin-top: 6px; }
    .banner { padding: 6px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
    .warn { background: var(--warn-bg); color: var(--warn-text); }
    .error { background: var(--error-bg); color: var(--error-text); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 4px; margin-bottom: 6px; }
    .stat { border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
    .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); font-size: 11px; }
    .pass { display: grid; grid-template-columns: 110px 1fr 52px; gap: 6px; align-items: center;
            font-size: 12px; margin: 2px 0; }
    .pass .track { background: var(--code-bg); border-radius: 3px; height: 8px; }
    .pass .fill { background: var(--bar); border-radius: 3px; height: 8px; }
    .pass .ms { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    pre { background: var(--code-bg); padding: 6px 8px; border-radius: 6px; overflow-x: auto; margin: 4px 0 0; }
    .change { font-size: 13px; margin: 2px 0; }
    .reason { margin: 6px 0; }
    .muted { color: var(--muted); }
    footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 8px; }

    /* Bottleneck verdict */
    .verdict { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
    .verdict-sub { color: var(--muted); margin: 0 0 8px; font-size: 12px; }
    .thread { display: grid; grid-template-columns: 110px 1fr 92px; gap: 6px; align-items: center;
              font-size: 12px; margin: 3px 0; }
    .thread .track { position: relative; background: var(--code-bg); border-radius: 3px; height: 10px; }
    .thread .fill { border-radius: 3px; height: 10px; }
    .thread .ms { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    .legend .line-key { display: inline-block; width: 16px; height: 2px; margin-right: 6px; vertical-align: 4px; }

    /* Frame-time chart */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; touch-action: none; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .tooltip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--border);
               border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
               white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tooltip b { display: block; margin-bottom: 2px; }

    /* "Who limited each frame" split bar */
    .split { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
    .split div { height: 100%; }
    .split div:first-child { border-radius: 4px 0 0 4px; }
    .split div:last-child { border-radius: 0 4px 4px 0; }
    details { margin-top: 6px; font-size: 12px; }
    summary { cursor: pointer; color: var(--muted); }
    table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--border); }
    /* Only stack the bars on very narrow windows; the default side window is ~420px. */
    @media (max-width: 360px) {
      .pass { grid-template-columns: 90px 1fr 44px; }
      .thread { grid-template-columns: 1fr 96px; }
      .thread .track { grid-column: 1 / -1; grid-row: 2; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // One fixed color + name per engine part, used by every chart so colors always mean the same thing.
    const PARTS = [
      { key: "game",   name: "Game thread (CPU)",   color: "var(--s-game)" },
      { key: "render", name: "Render thread (CPU)", color: "var(--s-render)" },
      { key: "gpu",    name: "GPU",                 color: "var(--s-gpu)" },
    ];

    // Plain-English advice for each kind of bottleneck.
    const ADVICE = {
      gpu: "The GPU finishes last. Graphics settings (resolution, shadows, post-processing) should help.",
      render: "The render thread finishes last: too many draw calls or objects. Lowering pixel-heavy settings won't help much.",
      game: "Game logic finishes last (AI, physics, Blueprints). Graphics settings won't help much.",
      mixed: "Two parts are almost tied. Improving only one of them will give a small gain.",
    };

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function App() {
      // The key lives only in this React state: never saved to localStorage or disk.
      const [apiKey, setApiKey] = useState("");
      const [source, setSource] = useState("unreal");  // "unreal" or "csv": where the measurements come from
      const [csvPath, setCsvPath] = useState("");
      const [busy, setBusy] = useState("");  // "", "analyze", "benchmark" or "optimize"
      const [error, setError] = useState("");
      const [note, setNote] = useState("");
      const [summary, setSummary] = useState(null);
      const [rounds, setRounds] = useState(3);
      const [goal, setGoal] = useState("");  // the developer's direction for the AI (optional)
      const [progress, setProgress] = useState([]);  // status lines from the running optimize loop
      const [result, setResult] = useState(null);    // what the optimize loop found

      // On startup: rejoin a running optimize, or show the last result, or Unreal's newest capture.
      useEffect(() => {
        fetch("/api/optimize/status").then(r => r.json()).then(status => {
          if (status.running) {
            setBusy("optimize");
            return watchOptimize().finally(() => setBusy(""));
          }
          if (status.result) return showResult(status.result);
          return fetch("/api/latest-csv").then(r => r.json()).then(d => {
            if (d.csv_path) {
              setCsvPath(d.csv_path);
              setNote(`Showing Unreal's newest capture: ${d.csv_path}`);
              analyze(d.csv_path);
            } else {
              setNote(d.note);
            }
          });
        }).catch(() => {});
      }, []);

      async function analyze(path = csvPath) {
        if (!path.trim()) return setError("Enter the path to a CSV file first.");
        setBusy("analyze"); setError("");
        try {
          const data = await postJson("/api/analyze", { csv_path: path });
          setSummary(data.summary);
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      async function benchmark() {
        setBusy("benchmark"); setError("");
        try {
          const data = await postJson("/api/benchmark", {});
          setCsvPath(data.csv_path);
          setSummary(data.summary);
          setNote("Fresh capture from Unreal.");
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      // The full loop: the server runs it in the background and we ask for its progress every second.
      async function optimize() {
        setBusy("optimize"); setError(""); setResult(null); setProgress([]);
        try {
          await postJson("/api/optimize", { api_key: apiKey, rounds: Number(rounds), goal });
          await watchOptimize();
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      async function watchOptimize() {
        while (true) {
          const status = await fetch("/api/optimize/status").then(r => r.json());
          setProgress(status.lines);
          if (!status.running) {
            if (status.error) setError(status.error);
            if (status.result) showResult(status.result);
            return;
          }
          await new Promise(done => setTimeout(done, 1000));
        }
      }

      function showResult(found) {
        setResult(found);
        setSummary(found.best);
        setNote("Charts below show the best run of the last optimization.");
      }

      return (
        <main>
          {/* One-row header: name, measurement source, and the main action. */}
          <div className="topbar">
            <h1 title="The AI suggests. Measurements decide. The developer approves.">Frame<span>Optimizer</span></h1>
            <div className="tabs" role="tablist" aria-label="Measurement source">
              <button role="tab" aria-selected={source === "unreal"} className={source === "unreal" ? "on" : ""}
                      onClick={() => setSource("unreal")} disabled={!!busy}>Unreal</button>
              <button role="tab" aria-selected={source === "csv"} className={source === "csv" ? "on" : ""}
                      onClick={() => setSource("csv")} disabled={!!busy}>CSV</button>
            </div>
            {source === "unreal" ? (
              <button className="run" onClick={benchmark} disabled={!!busy}
                      title="Launches Unreal with the baseline settings, records the benchmark scene, and analyzes the capture. Uses the paths in config.local.json.">
                {busy === "benchmark" ? "Running…" : "▶ Benchmark"}
              </button>
            ) : (
              <button className="run" onClick={() => analyze()} disabled={!!busy}>
                {busy === "analyze" ? "Analyzing…" : "▶ Analyze"}
              </button>
            )}
          </div>

          <div style={{ marginBottom: 8 }}>
            {source === "csv" && (
              <input id="csv" aria-label="Path to an Unreal CSV profile" value={csvPath}
                     placeholder="Path to Unreal CSV, e.g. C:/Games/MyGame/Saved/Profiling/CSV/capture.csv"
                     onChange={e => setCsvPath(e.target.value)} />
            )}
            {note && <p className="hint" title={note}
                        style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{note}</p>}
            {busy === "benchmark" && (
              <div className="banner warn running">
                Unreal is running the benchmark scene with the baseline settings.
                Leave the Unreal window alone until it closes.
              </div>
            )}
          </div>

          {error && <div className="banner error">{error}</div>}

          {/* Optimize always runs in Unreal, so it is only offered on the Unreal tab. */}
          {source === "unreal" && <div className="card">
            <h2>Optimize</h2>
            <p className="hint" style={{ margin: "0 0 6px" }}>
              Measures the baseline in Unreal. Then, each round, the AI proposes one approved change,
              Unreal tests it, and only measured improvements are kept.
            </p>
            <label htmlFor="key">Anthropic API key</label>
            <input id="key" type="password" autoComplete="off" placeholder="sk-ant-..."
                   value={apiKey} onChange={e => setApiKey(e.target.value)} />
            <div className="hint">Kept in this page's memory only and sent to your local server. Never saved.</div>
            <label htmlFor="rounds">Rounds (1 to 10, one Unreal run each)</label>
            <input id="rounds" type="number" min="1" max="10" value={rounds} style={{ width: 70 }}
                   onChange={e => setRounds(e.target.value)} />
            <label htmlFor="goal">Direction for the AI (optional)</label>
            <textarea id="goal" rows="2" maxLength={500} value={goal} onChange={e => setGoal(e.target.value)}
                      placeholder={'e.g. "Moody horror scene: keep shadows and fog. Aim for 60 FPS." or "Competitive: max FPS, blur and fog don\'t matter."'} />
            <div className="hint">Steers which approved settings the AI tries. It can't unlock anything outside the allowlist.</div>
            <div>
              <button onClick={optimize} disabled={!!busy}>
                {busy === "optimize" ? "Optimizing…" : "▶ Optimize"}
              </button>
            </div>
            {busy === "optimize" && (
              <p className="hint">Unreal opens and closes once per run. Leave its window alone.</p>
            )}
            {progress.length > 0 && <pre>{progress.join("\n")}</pre>}
          </div>}

          {source === "unreal" && result && <Result result={result} />}
          {summary && <Measurements summary={summary} />}

          <footer>Runs locally at 127.0.0.1. Nothing in your Unreal project is changed.</footer>
        </main>
      );
    }

    // What the optimize loop found: start vs best, every round, and the settings to apply.
    function Result({ result }) {
      const { start, best, total, rounds } = result;
      const changed = Object.entries(result.best_settings).filter(([s, v]) => result.start_settings[s] !== v);
      const signed = pct => `${pct > 0 ? "+" : ""}${pct}%`;
      const [applyMsg, setApplyMsg] = useState("");    // what happened after Apply / Undo
      const [applied, setApplied] = useState(false);   // shows the Undo button after a successful Apply

      async function applyToProject() {
        if (!window.confirm("Write these settings into your project's Config/DefaultEngine.ini?\nA backup is made first, and Undo restores it.")) return;
        try {
          const data = await postJson("/api/apply", {});
          setApplied(true);
          setApplyMsg(`Applied to ${data.ini}. Backup: ${data.backup}. Restart the Unreal editor to see it.`);
        } catch (e) {
          setApplyMsg(`Apply failed: ${e.message}`);
        }
      }

      async function undoApply() {
        try {
          const data = await postJson("/api/undo-apply", {});
          setApplied(false);
          setApplyMsg(`Undone: ${data.ini} restored from the backup.`);
        } catch (e) {
          setApplyMsg(`Undo failed: ${e.message}`);
        }
      }

      return (
        <div className="card">
          <h2>Result: {total.verdict}</h2>
          {result.goal && <p className="hint" style={{ margin: "0 0 6px" }}>Your direction: “{result.goal}”</p>}
          <div className="stats">
            <div className="stat"><b>{start.median_ms} → {best.median_ms} ms</b><small>median frame ({signed(total.median_change_pct)})</small></div>
            <div className="stat"><b>{start.p95_ms} → {best.p95_ms} ms</b><small>p95 frame ({signed(total.p95_change_pct)})</small></div>
            <div className="stat"><b>{start.median_fps} → {best.median_fps}</b><small>median FPS</small></div>
          </div>
          {result.stopped_early && <div className="banner warn">{result.stopped_early}</div>}

          <h3>Rounds</h3>
          <table>
            <thead><tr><th>#</th><th>Change</th><th>Median</th><th>Verdict</th></tr></thead>
            <tbody>
              {rounds.map(r => (
                <tr key={r.round} title={r.experiment.reason}>
                  <td>{r.round}</td>
                  <td>{Object.entries(r.experiment.settings).map(([s, v]) => `${s}=${v}`).join(", ")}</td>
                  <td>{signed(r.comparison.median_change_pct)}</td>
                  <td>{r.comparison.verdict}, <b>{r.kept ? "kept" : "discarded"}</b></td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="hint">Hover a row to read why the AI proposed it.</p>

          <h3>Settings to apply</h3>
          {changed.length === 0
            ? <p className="muted" style={{ margin: 0 }}>No tested change gave a clear measured improvement. Keep the starting settings.</p>
            : changed.map(([setting, value]) => (
                <div className="change" key={setting}><code>{setting}</code>: {result.start_settings[setting]} → <b>{value}</b></div>
              ))}
          <p className="hint">You approve: check the visual trade-offs in the reports before applying.</p>
          {changed.length > 0 && (
            <div>
              <button onClick={applyToProject} disabled={applied}>Apply to project</button>{" "}
              {applied && <button onClick={undoApply}>Undo</button>}
              {applyMsg && <p className="hint" style={{ wordBreak: "break-all" }}>{applyMsg}</p>}
            </div>
          )}
          <p className="hint" title={result.summary_report}>Summary: <code>{result.summary_report}</code></p>
        </div>
      );
    }

    function Measurements({ summary }) {
      const passes = Object.entries(summary.gpu_passes).sort((a, b) => b[1] - a[1]);
      const biggest = passes.length ? passes[0][1] : 1;

      return (
        <>
          <div className="card">
            <h2>Measurements</h2>
            <div className="stats">
              <div className="stat"><b>{summary.median_ms} ms</b><small>median frame</small></div>
              <div className="stat"><b>{summary.p95_ms} ms</b><small>p95 frame</small></div>
              <div className="stat"><b>{summary.max_ms} ms</b><small>worst frame</small></div>
              <div className="stat"><b>{summary.median_fps}</b><small>median FPS</small></div>
            </div>
            <p className="muted" style={{ margin: 0 }}>{summary.frames} frames analyzed (warm-up frames skipped).</p>
          </div>

          {summary.bottleneck
            ? <Bottleneck bottleneck={summary.bottleneck} frameMs={summary.median_ms} timeline={summary.timeline} />
            : <div className="card muted">This CSV has no GameThreadTime / RenderThreadTime / GPUTime columns, so the bottleneck can't be measured.</div>}

          {passes.length > 0 && (
            <div className="card">
              <h2>GPU passes: where the GPU time goes</h2>
              {passes.map(([name, ms]) => (
                <div className="pass" key={name}>
                  <span>{name.replace("GPU/", "")}</span>
                  <div className="track"><div className="fill" style={{ width: `${(ms / biggest) * 100}%` }} /></div>
                  <span className="ms">{ms} ms</span>
                </div>
              ))}
            </div>
          )}
        </>
      );
    }

    // Visual 1 + 3: the verdict, the per-part bars, and the "who limited each frame" split.
    function Bottleneck({ bottleneck, frameMs, timeline }) {
      const parts = PARTS.filter(p => p.key in bottleneck.median_ms);
      const headline = bottleneck.bound === "mixed" ? bottleneck.label
        : bottleneck.bound === "gpu" ? "GPU-bound" : `CPU-bound: ${bottleneck.label.replace(" (CPU)", "")}`;

      return (
        <div className="card">
          <h2>CPU or GPU bottleneck?</h2>
          <p className="verdict">{headline}</p>
          <p className="verdict-sub">
            {ADVICE[bottleneck.bound]} The slowest part takes {bottleneck.share_of_frame_pct}% of the {frameMs} ms median frame.
          </p>

          {parts.map(p => {
            const ms = bottleneck.median_ms[p.key];
            const pct = Math.min(100, (ms / frameMs) * 100);
            return (
              <div className="thread" key={p.key}>
                <span><span className="swatch" style={{ background: p.color }} />{p.name}</span>
                <div className="track" title={`${p.name}: ${ms} ms median`}>
                  <div className="fill" style={{ width: `${pct}%`, background: p.color }} />
                </div>
                <span className="ms">{ms} ms · {Math.round(pct)}%</span>
              </div>
            );
          })}
          <p className="hint">Bar length = median time ÷ median frame time. All three run in parallel, so the longest bar sets the frame rate.</p>

          <h3>Frame time over the capture (ms)</h3>
          <FrameChart timeline={timeline} parts={parts} />

          <h3>Which part was slowest, frame by frame</h3>
          <div className="split" role="img"
               aria-label={parts.map(p => `${p.name} ${bottleneck.frames_limited_pct[p.key]}%`).join(", ")}>
            {parts.filter(p => bottleneck.frames_limited_pct[p.key] > 0).map(p => (
              <div key={p.key} title={`${p.name}: slowest in ${bottleneck.frames_limited_pct[p.key]}% of frames`}
                   style={{ width: `${bottleneck.frames_limited_pct[p.key]}%`, background: p.color }} />
            ))}
          </div>
          <div className="legend" style={{ marginTop: 8 }}>
            {parts.map(p => (
              <span key={p.key}><span className="swatch" style={{ background: p.color }} />{p.name} <b style={{ color: "var(--text)" }}>{bottleneck.frames_limited_pct[p.key]}%</b></span>
            ))}
          </div>
          <p className="hint">If this bar is split between parts, the bottleneck changes during gameplay. Check the chart above for where.</p>

          <details>
            <summary>Show as table</summary>
            <table>
              <thead><tr><th>Part</th><th>Median ms</th><th>% of frame</th><th>Slowest in % of frames</th></tr></thead>
              <tbody>
                {parts.map(p => (
                  <tr key={p.key}>
                    <td>{p.name}</td>
                    <td>{bottleneck.median_ms[p.key]}</td>
                    <td>{Math.round((bottleneck.median_ms[p.key] / frameMs) * 100)}%</td>
                    <td>{bottleneck.frames_limited_pct[p.key]}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </details>
          <p className="hint">Estimate from measured thread times. Unreal's GPU timing can overlap other work, so treat close calls with care.</p>
        </div>
      );
    }

    // Visual 2: line chart of frame time + each part, with a hover crosshair and tooltip.
    function FrameChart({ timeline, parts }) {
      const [hover, setHover] = useState(null);
      const svgRef = useRef(null);

      const W = 700, H = 240, left = 36, right = 10, top = 10, bottom = 26;
      const plotW = W - left - right, plotH = H - top - bottom;
      const n = timeline.frame.length;
      const maxValue = Math.max(...timeline.frame, ...parts.flatMap(p => timeline[p.key]));
      const yMax = Math.ceil(maxValue / 5) * 5;
      const tickStep = yMax > 40 ? 10 : 5;

      const x = i => left + (n === 1 ? 0 : (i / (n - 1)) * plotW);
      const y = ms => top + plotH - (ms / yMax) * plotH;
      const path = values => values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

      const ticks = [];
      for (let t = 0; t <= yMax; t += tickStep) ticks.push(t);
      const target60 = 1000 / 60;  // 16.7 ms = 60 FPS

      function onMove(event) {
        const box = svgRef.current.getBoundingClientRect();
        const svgX = ((event.clientX - box.left) / box.width) * W;
        const i = Math.round(((svgX - left) / plotW) * (n - 1));
        setHover(Math.max(0, Math.min(n - 1, i)));
      }

      const series = [{ key: "frame", name: "Frame time", color: "var(--s-frame)" }, ...parts];

      return (
        <>
          <div className="legend">
            {series.map(s => (
              <span key={s.key}><span className="line-key" style={{ background: s.color }} />{s.name}</span>
            ))}
            <span><span className="line-key" style={{ borderTop: "2px dashed var(--muted)", height: 0 }} />60 FPS (16.7 ms)</span>
          </div>
          <div className="chart">
            <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} onPointerMove={onMove} onPointerLeave={() => setHover(null)}
                 role="img" aria-label="Line chart of frame time and per-part times across the capture">
              {ticks.map(t => (
                <g key={t}>
                  <line x1={left} x2={W - right} y1={y(t)} y2={y(t)} stroke="var(--grid)" strokeWidth="1" />
                  <text x={left - 6} y={y(t) + 4} textAnchor="end">{t}</text>
                </g>
              ))}
              <text x={left} y={H - 6}>start</text>
              <text x={W - right} y={H - 6} textAnchor="end">end of capture</text>

              {target60 <= yMax && (
                <line x1={left} x2={W - right} y1={y(target60)} y2={y(target60)}
                      stroke="var(--muted)" strokeWidth="1" strokeDasharray="4 4" />
              )}

              {parts.map(p => (
                <path key={p.key} d={path(timeline[p.key])} fill="none" stroke={p.color} strokeWidth="2"
                      strokeLinejoin="round" strokeLinecap="round" />
              ))}
              <path d={path(timeline.frame)} fill="none" stroke="var(--s-frame)" strokeWidth="2"
                    strokeLinejoin="round" strokeLinecap="round" />

              {hover !== null && (
                <g>
                  <line x1={x(hover)} x2={x(hover)} y1={top} y2={top + plotH} stroke="var(--muted)" strokeWidth="1" />
                  {series.map(s => (
                    <circle key={s.key} cx={x(hover)} cy={y(timeline[s.key][hover])} r="4"
                            fill={s.color} stroke="var(--card)" strokeWidth="2" />
                  ))}
                </g>
              )}
              {/* Invisible rectangle so the whole plot area catches the pointer. */}
              <rect x={left} y={top} width={plotW} height={plotH} fill="transparent" />
            </svg>

            {hover !== null && (
              <div className="tooltip" style={x(hover) > W / 2
                  ? { right: `${((W - x(hover)) / W) * 100 + 1}%` }
                  : { left: `${(x(hover) / W) * 100 + 1}%` }}>
                <b>Frame #{timeline.frame_index[hover]}</b>
                {series.map(s => (
                  <div key={s.key}>
                    <span className="swatch" style={{ background: s.color }} />
                    {s.name}: {timeline[s.key][hover].toFixed(2)} ms
                  </div>
                ))}
              </div>
            )}
          </div>
          <p className="hint">Hover to inspect a frame. The line that sits just under "Frame time" is the bottleneck. Spikes are hitches.</p>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
