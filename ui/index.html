<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrameOptimizer</title>
  <!-- React + Babel load from cdnjs (Cloudflare). Same versions as before; unpkg.com was unreliable. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5d6573; --border: #dde1e7; --soft: #eef0f3;
      --accent: #d13639; --accent-text: #ffffff;
      --good: #1a7f4b; --good-bg: #e3f5ea; --bad: #b42318; --bad-bg: #fdecea; --info: #1f6fc5; --info-bg: #e5f0fc;
      --warn-bg: #fff4d6; --warn-text: #7a5300; --grid: #e6e9ee;
      /* Chart series colors (colorblind-safe set): one fixed color per engine part, used everywhere. */
      --s-game: #1baf7a; --s-render: #eb6834; --s-gpu: #2a78d6; --s-frame: #16181d; --s-pass: #d13639;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa3b2; --border: #2c313a; --soft: #232730;
        --accent: #ff5a5f; --accent-text: #111317;
        --good: #5fd39a; --good-bg: #173326; --bad: #ff8a80; --bad-bg: #3d1717; --info: #7fb2f0; --info-bg: #172a40;
        --warn-bg: #3a2f10; --warn-text: #ffd27a; --grid: #262a32;
        --s-game: #199e70; --s-render: #d95926; --s-gpu: #3987e5; --s-frame: #e8eaee; --s-pass: #ff5a5f;
      }
    }

    /* ---------- Base: built for a narrow window beside the running game (360-420px), fine when wider. */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 10px 12px 16px; }
    h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; cursor: default; }
    h1 span { color: var(--accent); }
    h2 { margin: 0; font-size: 14px; }
    h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
    .wrap { overflow-wrap: anywhere; }  /* long paths and setting names break instead of overflowing */

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .card-head .muted { font-size: 12px; text-align: right; }

    /* ---------- Controls */
    button { padding: 6px 12px; border: 0; border-radius: 7px; background: var(--accent); color: var(--accent-text);
             font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.secondary { background: var(--soft); color: var(--text); }
    button.link { background: none; color: var(--muted); padding: 2px 0; font-weight: 500; text-decoration: underline; }
    button.primary { width: 100%; margin-top: 14px; padding: 9px; font-size: 14px; }
    input, textarea { width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border);
                      background: var(--bg); color: var(--text); font: inherit; }
    textarea { resize: vertical; }
    input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--accent); margin: 4px 0 0; }
    label { font-weight: 600; font-size: 12.5px; }
    .field { margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .field-head .note { color: var(--muted); font-size: 12px; text-align: right; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row input[type=number] { width: 70px; }

    /* ---------- Top bar + project line */
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .topbar .run { margin-left: auto; }
    .tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--soft); }
    .tabs button { padding: 3px 10px; background: transparent; color: var(--muted); }
    .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .project { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
    .project .info { min-width: 0; flex: 1; }
    .project .info div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- Banners, status, log */
    .banner { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; margin-bottom: 10px; }
    .warn { background: var(--warn-bg); color: var(--warn-text); }
    .error { background: var(--bad-bg); color: var(--bad); }
    .status { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 8px 10px;
              background: var(--soft); border-radius: 8px; font-size: 12.5px; }
    .pulse { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--accent);
             animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    details > summary { cursor: pointer; color: var(--muted); }
    details.log { margin-top: 8px; font-size: 12px; }
    pre { background: var(--soft); padding: 8px; border-radius: 8px; margin: 6px 0 0; max-height: 260px; overflow: auto;
          white-space: pre-wrap; overflow-wrap: anywhere; }

    /* ---------- Result */
    .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .hero-fps { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .hero-fps small { font-size: 14px; font-weight: 600; color: var(--muted); }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
    .badge.good { background: var(--good-bg); color: var(--good); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.info { background: var(--info-bg); color: var(--info); }
    .badge.neutral { background: var(--soft); color: var(--muted); }
    .apply-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border);
                 font-variant-numeric: tabular-nums; }
    .apply-row:last-child { border-bottom: 0; }
    .apply-row code { min-width: 0; overflow-wrap: anywhere; }
    .apply-row span { flex: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

    /* Round cards: one compact card per experiment, tap to see settings and the AI's reason. */
    details.round { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
    details.round > summary { list-style: none; display: grid; grid-template-columns: auto auto 1fr; align-items: center;
                              gap: 2px 8px; padding: 7px 10px; color: var(--text); }
    details.round > summary::-webkit-details-marker { display: none; }
    details.round[open] > summary { border-bottom: 1px solid var(--border); }
    .round-name { font-weight: 650; }
    .round-fps { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .round-preview { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .round-body { padding: 8px 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .chip { background: var(--soft); border-radius: 5px; padding: 1px 6px; font-size: 11.5px; overflow-wrap: anywhere; }

    /* ---------- Measurements */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }
    .stat { background: var(--soft); border-radius: 8px; padding: 6px 8px; }
    .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); font-size: 11px; }
    .verdict { font-size: 17px; font-weight: 750; }
    /* A meter: label and value on one line, full-width bar below, so long names never collide with the bar. */
    .meter { margin: 7px 0; }
    .meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .meter-top .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meter-top .value { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
    .track { background: var(--soft); border-radius: 4px; height: 8px; margin-top: 3px; }
    .fill { border-radius: 4px; height: 8px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .legend .line-key { display: inline-block; width: 14px; height: 2px; margin-right: 5px; vertical-align: 4px; }
    .split { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
    .split div { height: 100%; }

    /* Frame-time chart: drawn at the real width of its box, so its text stays readable in a narrow window. */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; touch-action: none; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .tooltip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--border);
               border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
               white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tooltip b { display: block; margin-bottom: 2px; }

    footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <!-- React replaces this message as soon as the page starts. If it stays, the scripts above didn't load. -->
  <div id="root"><main><div class="banner warn">
    Loading FrameOptimizer… If this message stays, the page couldn't download React from cdnjs.cloudflare.com.
    Check your internet connection, then reload (F5).
  </div></main></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // One fixed color + name per engine part, used by every chart so colors always mean the same thing.
    const PARTS = [
      { key: "game",   name: "Game thread (CPU)",   color: "var(--s-game)" },
      { key: "render", name: "Render thread (CPU)", color: "var(--s-render)" },
      { key: "gpu",    name: "GPU",                 color: "var(--s-gpu)" },
    ];

    // Plain-English advice for each kind of bottleneck.
    const ADVICE = {
      gpu: "The GPU finishes last. Graphics settings (resolution, shadows, post-processing) should help.",
      render: "The render thread finishes last: too many draw calls or objects. Settings that draw fewer objects help most.",
      game: "Game logic finishes last (AI, physics, Blueprints). Graphics settings won't help much.",
      mixed: "Two parts are almost tied. Improving only one of them gives a small gain.",
    };

    const signed = pct => `${pct > 0 ? "+" : ""}${pct}%`;
    const fileName = path => path.split(/[\\/]/).pop();

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    // Where Unreal is: paste the .uproject path once; the server finds Unreal and the map by itself.
    function ProjectCard({ disabled, onSaved }) {
      const [config, setConfig] = useState(undefined);  // undefined = still loading, null = not set yet
      const [editing, setEditing] = useState(false);
      const [uproject, setUproject] = useState("");
      const [mapName, setMapName] = useState("");  // optional: blank = the project's default map
      const [exe, setExe] = useState("");          // optional: blank = find Unreal automatically
      const [error, setError] = useState("");
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        fetch("/api/project").then(r => r.json()).then(d => setConfig(d.config)).catch(() => setConfig(null));
      }, []);

      async function save() {
        setSaving(true); setError("");
        try {
          const data = await postJson("/api/project", { uproject, map: mapName, unreal_exe: exe });
          setConfig(data.config);
          setEditing(false);
          onSaved();
        } catch (e) {
          setError(e.message);
        } finally {
          setSaving(false);
        }
      }

      function change() {
        setUproject(config.project); setMapName(""); setExe(""); setError(""); setEditing(true);
      }

      if (config === undefined) return null;

      // Project already set: one compact line.
      if (config && !editing) {
        const name = fileName(config.project).replace(/\.uproject$/i, "");
        const version = (config.unreal_exe.match(/UE_([^/]+)/) || [])[1];
        return (
          <div className="card project" title={config.project}>
            <div className="info">
              <div><b>{name}</b> <span className="muted">{version ? `· UE ${version}` : ""}</span></div>
              <div className="muted" style={{ fontSize: 12 }}>{config.map || "default map"}</div>
            </div>
            <button className="secondary" onClick={change} disabled={disabled}>Change</button>
          </div>
        );
      }

      return (
        <div className="card">
          <div className="card-head"><h2>Unreal project</h2></div>
          <div className="field">
            <label htmlFor="uproject">Path to your .uproject file</label>
            <input id="uproject" value={uproject} onChange={e => setUproject(e.target.value)}
                   placeholder="C:/UnrealProjects/MyGame/MyGame.uproject" />
            <div className="hint">In File Explorer: right-click the .uproject file → "Copy as path".</div>
          </div>
          <details className="field">
            <summary>More options</summary>
            <div className="field">
              <label htmlFor="map">Benchmark map</label>
              <input id="map" value={mapName} onChange={e => setMapName(e.target.value)}
                     placeholder="blank = the project's default map" />
            </div>
            <div className="field">
              <label htmlFor="exe">UnrealEditor.exe</label>
              <input id="exe" value={exe} onChange={e => setExe(e.target.value)} placeholder="blank = find it automatically" />
            </div>
          </details>
          {error && <div className="banner error wrap" style={{ margin: "10px 0 0" }}>{error}</div>}
          <div className="actions">
            <button onClick={save} disabled={saving || disabled || !uproject.trim()}>{saving ? "Checking…" : "Save"}</button>
            {config && <button className="secondary" onClick={() => setEditing(false)} disabled={saving}>Cancel</button>}
          </div>
        </div>
      );
    }

    function App() {
      // The key lives only in this React state: never saved to localStorage or disk.
      const [apiKey, setApiKey] = useState("");
      const [source, setSource] = useState("unreal");  // "unreal" or "csv": where the measurements come from
      const [csvPath, setCsvPath] = useState("");
      const [busy, setBusy] = useState("");  // "", "analyze", "benchmark" or "optimize"
      const [error, setError] = useState("");
      const [note, setNote] = useState("");  // shown when there is nothing to measure yet
      const [summary, setSummary] = useState(null);
      const [summaryLabel, setSummaryLabel] = useState("");  // what the Measurements card is showing
      const [rounds, setRounds] = useState(3);
      const [goal, setGoal] = useState("");  // the developer's direction for the AI (optional)
      const [freedom, setFreedom] = useState(50);  // Quality freedom slider: how far down each setting the AI may go
      const [frames, setFrames] = useState(1200);  // Test length slider: frames recorded per Unreal run
      const [progress, setProgress] = useState([]);  // status lines from the running optimize loop
      const [result, setResult] = useState(null);    // what the optimize loop found
      const [formOpen, setFormOpen] = useState(true);  // the Optimize form folds away once a result is shown

      // On startup: rejoin a running optimize, or show the last result, or Unreal's newest capture.
      useEffect(() => {
        fetch("/api/optimize/status").then(r => r.json()).then(status => {
          if (status.running) {
            setBusy("optimize");
            return watchOptimize().finally(() => setBusy(""));
          }
          if (status.result) return showResult(status.result);
          return showLatestCapture();
        }).catch(() => {});
      }, []);

      // Show the newest CSV Unreal already saved for this project (also re-run after the project changes).
      async function showLatestCapture() {
        const d = await fetch("/api/latest-csv").then(r => r.json());
        if (d.csv_path) {
          setCsvPath(d.csv_path);
          setNote("");
          analyze(d.csv_path, `Newest capture · ${fileName(d.csv_path)}`);
        } else {
          setNote(d.note);
          setSummary(null);
        }
      }

      async function analyze(path = csvPath, label = `CSV · ${fileName(path)}`) {
        if (!path.trim()) return setError("Enter the path to a CSV file first.");
        setBusy("analyze"); setError("");
        try {
          const data = await postJson("/api/analyze", { csv_path: path });
          setSummary(data.summary);
          setSummaryLabel(label);
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      async function benchmark() {
        setBusy("benchmark"); setError("");
        try {
          const data = await postJson("/api/benchmark", {});
          setCsvPath(data.csv_path);
          setSummary(data.summary);
          setSummaryLabel("Fresh benchmark · starting settings");
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      // The full loop: the server runs it in the background and we ask for its progress every second.
      async function optimize() {
        setBusy("optimize"); setError(""); setResult(null); setProgress([]); setFormOpen(true);
        try {
          await postJson("/api/optimize", { api_key: apiKey, rounds: Number(rounds), goal, freedom, frames });
          await watchOptimize();
        } catch (e) {
          setError(e.message);
        } finally {
          setBusy("");
        }
      }

      async function watchOptimize() {
        while (true) {
          const status = await fetch("/api/optimize/status").then(r => r.json());
          setProgress(status.lines);
          if (!status.running) {
            if (status.error) setError(status.error);
            if (status.result) showResult(status.result);
            return;
          }
          await new Promise(done => setTimeout(done, 1000));
        }
      }

      function showResult(found) {
        setResult(found);
        setSummary(found.best);
        setSummaryLabel("Best run of the last optimization");
        setFormOpen(false);
      }

      const showResultCard = source === "unreal" && result;

      return (
        <main>
          {/* One-row header: name, measurement source, and the quick action for that source. */}
          <div className="topbar">
            <h1 title="The AI suggests. Measurements decide. The developer approves.">Frame<span>Optimizer</span></h1>
            <div className="tabs" role="tablist" aria-label="Measurement source">
              <button role="tab" aria-selected={source === "unreal"} className={source === "unreal" ? "on" : ""}
                      onClick={() => setSource("unreal")} disabled={!!busy}>Unreal</button>
              <button role="tab" aria-selected={source === "csv"} className={source === "csv" ? "on" : ""}
                      onClick={() => setSource("csv")} disabled={!!busy}>CSV</button>
            </div>
            {source === "unreal" ? (
              <button className="run" onClick={benchmark} disabled={!!busy}
                      title="Launches Unreal with the starting settings, records the scene once, and shows the measurements.">
                {busy === "benchmark" ? "Running…" : "▶ Benchmark"}
              </button>
            ) : (
              <button className="run" onClick={() => analyze()} disabled={!!busy}>
                {busy === "analyze" ? "Analyzing…" : "▶ Analyze"}
              </button>
            )}
          </div>

          {source === "unreal" && <ProjectCard disabled={!!busy} onSaved={() => showLatestCapture().catch(() => {})} />}
          {source === "csv" && (
            <div className="card">
              <label htmlFor="csv">Unreal CSV profile</label>
              <input id="csv" value={csvPath} onChange={e => setCsvPath(e.target.value)}
                     placeholder="C:/Games/MyGame/Saved/Profiling/CSV/capture.csv" />
            </div>
          )}

          {error && <div className="banner error wrap">{error}</div>}
          {busy === "benchmark" && (
            <div className="banner warn">Unreal is recording the scene with the starting settings. Leave its window alone until it closes.</div>
          )}

          {showResultCard && <Result result={result} />}

          {/* Optimize always runs in Unreal, so it is only offered on the Unreal tab. */}
          {source === "unreal" && (
            <div className="card">
              <div className="card-head">
                <h2>{result && !formOpen ? "Run another optimization" : "Optimize"}</h2>
                {result && !busy && (
                  <button className="link" onClick={() => setFormOpen(!formOpen)}>{formOpen ? "Hide" : "Show"}</button>
                )}
              </div>
              {formOpen && (
                <OptimizeForm {...{ apiKey, setApiKey, rounds, setRounds, goal, setGoal, freedom, setFreedom,
                                    frames, setFrames, busy, optimize }} />
              )}
              <Progress lines={progress} running={busy === "optimize"} />
            </div>
          )}

          {summary && <Measurements summary={summary} label={summaryLabel}
                                    compact={showResultCard && summary === result.best} />}
          {!summary && note && <div className="card muted wrap">{note}</div>}

          <footer>Runs locally at 127.0.0.1 · Your Unreal project only changes when you click Apply.</footer>
        </main>
      );
    }

    function OptimizeForm({ apiKey, setApiKey, rounds, setRounds, goal, setGoal, freedom, setFreedom,
                            frames, setFrames, busy, optimize }) {
      const freedomText = freedom === 0 ? "Preserve graphics"
        : freedom < 50 ? "Small reductions"
        : freedom < 100 ? "Big reductions" : "Potato allowed";
      return (
        <>
          <p className="muted" style={{ marginBottom: 12 }}>
            The AI proposes approved settings, Unreal measures each one, and only real improvements are kept.
          </p>
          <div className="field">
            <div className="field-head"><label htmlFor="key">Anthropic API key</label><span className="note">never saved</span></div>
            <input id="key" type="password" autoComplete="off" placeholder="sk-ant-..."
                   value={apiKey} onChange={e => setApiKey(e.target.value)} />
          </div>
          <div className="field">
            <label htmlFor="goal">Direction for the AI <span className="muted" style={{ fontWeight: 400 }}>(optional)</span></label>
            <textarea id="goal" rows="2" maxLength={500} value={goal} onChange={e => setGoal(e.target.value)}
                      placeholder={'"Hit 150 FPS" or "Keep shadows and fog, aim for 60 FPS"'} />
          </div>
          <div className="field">
            <div className="field-head"><label htmlFor="freedom">Quality freedom</label>
              <span className="note"><b>{freedom}%</b> · {freedomText}</span></div>
            <input id="freedom" type="range" min="0" max="100" step="5" value={freedom}
                   onChange={e => setFreedom(Number(e.target.value))} />
            <div className="hint">
              How far down each setting may go.{freedom > 0 && " A potato test (everything at its lowest allowed value) runs first to show the most FPS settings can buy."}
            </div>
          </div>
          <div className="field">
            <div className="field-head"><label htmlFor="frames">Test length</label>
              <span className="note"><b>{frames}</b> frames · ≈ {Math.round(frames / 100)} s at 100 FPS</span></div>
            <input id="frames" type="range" min="600" max="3600" step="300" value={frames}
                   onChange={e => setFrames(Number(e.target.value))} />
            <div className="hint">Longer runs give steadier numbers but take longer.</div>
          </div>
          <div className="field row">
            <label htmlFor="rounds">AI rounds <span className="muted" style={{ fontWeight: 400 }}>(one Unreal run each)</span></label>
            <input id="rounds" type="number" min="1" max="10" value={rounds} onChange={e => setRounds(e.target.value)} />
          </div>
          <button className="primary" onClick={optimize} disabled={!!busy}>
            {busy === "optimize" ? "Optimizing…" : "▶ Optimize"}
          </button>
        </>
      );
    }

    // While running: the current step, live. Afterwards (or anytime): the full log, folded away.
    function Progress({ lines, running }) {
      if (!lines.length) return null;
      return (
        <>
          {running && (
            <div className="status wrap"><span className="pulse" />
              <span>{lines[lines.length - 1]}<br /><span className="muted">Unreal opens and closes once per run. Leave its window alone.</span></span>
            </div>
          )}
          <details className="log">
            <summary>Run log ({lines.length} lines)</summary>
            <pre>{lines.join("\n")}</pre>
          </details>
        </>
      );
    }

    // What the optimize loop found: the headline first, then what to apply, then every round.
    function Result({ result }) {
      const { start, best, total, rounds } = result;
      const changed = Object.entries(result.changes);
      const fpsGain = Math.round((best.median_fps / start.median_fps - 1) * 1000) / 10;
      const [showAll, setShowAll] = useState(false);
      const [applyMsg, setApplyMsg] = useState("");    // what happened after Apply / Undo
      const [applied, setApplied] = useState(false);   // shows the Undo button after a successful Apply
      const shown = showAll ? changed : changed.slice(0, 6);
      const runInfo = [result.freedom != null && `Quality freedom ${result.freedom}%`, result.frames && `${result.frames} frames per run`,
                       `${rounds.length} test${rounds.length === 1 ? "" : "s"}`].filter(Boolean).join(" · ");

      async function applyToProject() {
        if (!window.confirm("Write these settings into your project's Config/DefaultEngine.ini?\nA backup is made first, and Undo restores it.")) return;
        try {
          const data = await postJson("/api/apply", {});
          setApplied(true);
          setApplyMsg(`Applied to ${data.ini}. Backup: ${data.backup}. Restart the Unreal editor to see it.`);
        } catch (e) {
          setApplyMsg(`Apply failed: ${e.message}`);
        }
      }

      async function undoApply() {
        try {
          const data = await postJson("/api/undo-apply", {});
          setApplied(false);
          setApplyMsg(`Undone: ${data.ini} restored from the backup.`);
        } catch (e) {
          setApplyMsg(`Undo failed: ${e.message}`);
        }
      }

      return (
        <div className="card">
          <div className="card-head"><h2>Result</h2></div>
          <div className="hero">
            <div className="hero-fps">{start.median_fps} → {best.median_fps} <small>FPS</small></div>
            <span className={`badge ${total.verdict === "improved" ? "good" : total.verdict === "worse" ? "bad" : "neutral"}`}>
              {changed.length ? `${signed(fpsGain)} FPS` : "nothing kept"}
            </span>
          </div>
          <p className="sub">Median frame {start.median_ms} → {best.median_ms} ms · p95 {start.p95_ms} → {best.p95_ms} ms</p>
          <p className="sub">{runInfo}</p>
          {result.goal && <p className="sub wrap">Your direction: “{result.goal}”</p>}
          {result.stopped_early && <div className="banner warn wrap" style={{ margin: "10px 0 0" }}>{result.stopped_early}</div>}

          <h3>Settings to apply {changed.length > 0 && `(${changed.length})`}</h3>
          {changed.length === 0 ? (
            <p className="muted">No change gave a clear measured improvement, so the starting settings stay. Each test is listed below.</p>
          ) : (
            <>
              {shown.map(([setting, value]) => (
                <div className="apply-row" key={setting}>
                  <code>{setting}</code><span>{result.start_settings[setting]} → <b>{value}</b></span>
                </div>
              ))}
              {changed.length > 6 && (
                <button className="link" onClick={() => setShowAll(!showAll)}>{showAll ? "Show fewer" : `Show all ${changed.length}`}</button>
              )}
              <div className="actions">
                <button onClick={applyToProject} disabled={applied}>{applied ? "Applied ✓" : "Apply to project"}</button>
                {applied && <button className="secondary" onClick={undoApply}>Undo</button>}
              </div>
              <p className="hint">You approve: check the visual trade-offs in Unreal (or the round reports) before applying.</p>
              {applyMsg && <p className="hint wrap">{applyMsg}</p>}
            </>
          )}

          <h3>Tests</h3>
          {rounds.map(r => <RoundCard r={r} key={r.round} />)}
          <p className="hint wrap" title={result.summary_report}>Full report: <code>{result.summary_report}</code></p>
        </div>
      );
    }

    // One experiment: name, outcome badge and FPS on top; tap to see every setting and the AI's reason.
    function RoundCard({ r }) {
      const settings = Object.entries(r.experiment.settings);
      const [badgeClass, badgeText] = r.potato ? ["info", "ceiling test"]
        : r.kept ? ["good", "kept"]
        : r.comparison.verdict === "worse" ? ["bad", "worse"] : ["neutral", "no clear gain"];
      const preview = settings.slice(0, 3).map(([s, v]) => `${s}=${v}`).join(", ")
        + (settings.length > 3 ? `, +${settings.length - 3} more` : "");
      return (
        <details className="round">
          <summary>
            <span className="round-name">{r.potato ? "Potato" : `#${r.round}`}</span>
            <span className={`badge ${badgeClass}`}>{badgeText}</span>
            <span className="round-fps">{r.before.median_fps} → <b>{r.after.median_fps}</b> FPS</span>
            <span className="round-preview">{preview}</span>
          </summary>
          <div className="round-body">
            <p className="sub">
              Median frame {r.before.median_ms} → {r.after.median_ms} ms ({signed(r.comparison.median_change_pct)})
              {r.potato && " · every setting at its lowest allowed value, never kept"}
            </p>
            <div className="chips">{settings.map(([s, v]) => <code className="chip" key={s}>{s}={v}</code>)}</div>
            {r.experiment.reason && <p className="muted" style={{ fontSize: 12 }}>{r.experiment.reason}</p>}
          </div>
        </details>
      );
    }

    // A labeled bar: name and value on one line, the bar underneath.
    function Meter({ name, value, pct, color, title }) {
      return (
        <div className="meter" title={title || name}>
          <div className="meter-top"><span className="name">{name}</span><span className="value">{value}</span></div>
          <div className="track"><div className="fill" style={{ width: `${Math.min(100, pct)}%`, background: color }} /></div>
        </div>
      );
    }

    // compact = the Result card already shows this run's median/p95/FPS, so don't repeat them.
    function Measurements({ summary, label, compact }) {
      return (
        <>
          <div className="card">
            <div className="card-head"><h2>Measurements</h2><span className="muted wrap">{label}</span></div>
            {!compact && (
              <div className="stats" style={{ marginBottom: 6 }}>
                <div className="stat"><b>{summary.median_fps}</b><small>median FPS</small></div>
                <div className="stat"><b>{summary.median_ms}</b><small>median ms</small></div>
                <div className="stat"><b>{summary.p95_ms}</b><small>p95 ms</small></div>
                <div className="stat"><b>{summary.max_ms}</b><small>worst ms</small></div>
              </div>
            )}
            <p className="muted" style={{ fontSize: 12 }}>
              {summary.frames} frames analyzed (warm-up skipped){compact && ` · worst frame ${summary.max_ms} ms`}
            </p>
          </div>

          {summary.bottleneck
            ? <Bottleneck bottleneck={summary.bottleneck} frameMs={summary.median_ms} timeline={summary.timeline} />
            : <div className="card muted">This CSV has no GameThreadTime / RenderThreadTime / GPUTime columns, so the bottleneck can't be measured.</div>}

          <GpuPasses passes={summary.gpu_passes} />
        </>
      );
    }

    // The verdict, one bar per engine part, the frame-time chart, and who limited each frame.
    function Bottleneck({ bottleneck, frameMs, timeline }) {
      const parts = PARTS.filter(p => p.key in bottleneck.median_ms);
      const headline = bottleneck.bound === "mixed" ? bottleneck.label
        : bottleneck.bound === "gpu" ? "GPU-bound" : `CPU-bound: ${bottleneck.label.replace(" (CPU)", "")}`;

      return (
        <div className="card">
          <div className="card-head"><h2>Bottleneck</h2><span className="muted">{frameMs} ms median frame</span></div>
          <p className="verdict">{headline}</p>
          <p className="muted" style={{ fontSize: 12, marginBottom: 4 }}>{ADVICE[bottleneck.bound]}</p>

          {parts.map(p => {
            const ms = bottleneck.median_ms[p.key];
            const pct = (ms / frameMs) * 100;
            return <Meter key={p.key} name={p.name} value={`${ms} ms · ${Math.round(pct)}%`} pct={pct} color={p.color} />;
          })}
          <p className="hint">All parts run in parallel: the longest bar sets the frame rate.</p>

          <h3>Frame time over the capture</h3>
          <FrameChart timeline={timeline} parts={parts} />

          <h3>Slowest part, frame by frame</h3>
          <div className="split" role="img"
               aria-label={parts.map(p => `${p.name} ${bottleneck.frames_limited_pct[p.key]}%`).join(", ")}>
            {parts.filter(p => bottleneck.frames_limited_pct[p.key] > 0).map(p => (
              <div key={p.key} title={`${p.name}: slowest in ${bottleneck.frames_limited_pct[p.key]}% of frames`}
                   style={{ width: `${bottleneck.frames_limited_pct[p.key]}%`, background: p.color }} />
            ))}
          </div>
          <div className="legend">
            {parts.map(p => (
              <span key={p.key}><span className="swatch" style={{ background: p.color }} />{p.name} <b style={{ color: "var(--text)" }}>{bottleneck.frames_limited_pct[p.key]}%</b></span>
            ))}
          </div>
          <p className="hint">Estimated from Unreal's thread timers, which can overlap. Treat close calls with care.</p>
        </div>
      );
    }

    // Biggest GPU passes first; the long tail of tiny passes is folded away.
    function GpuPasses({ passes }) {
      const sorted = Object.entries(passes).sort((a, b) => b[1] - a[1]);
      if (!sorted.length) return null;
      const biggest = sorted[0][1] || 1;
      const top = sorted.slice(0, 8);
      const rest = sorted.slice(8);
      const row = ([name, ms]) => <Meter key={name} name={name.replace("GPU/", "")} value={`${ms} ms`}
                                         pct={(ms / biggest) * 100} color="var(--s-pass)" />;
      return (
        <div className="card">
          <div className="card-head"><h2>GPU passes</h2><span className="muted">where the GPU time goes</span></div>
          {top.map(row)}
          {rest.length > 0 && (
            <details className="log">
              <summary>All {sorted.length} passes</summary>
              {rest.map(row)}
            </details>
          )}
        </div>
      );
    }

    // Line chart of frame time + each part, with a hover crosshair and tooltip.
    function FrameChart({ timeline, parts }) {
      const [hover, setHover] = useState(null);
      const [W, setW] = useState(600);  // drawn at the real pixel width of its box (see the ResizeObserver)
      const boxRef = useRef(null);
      const svgRef = useRef(null);

      useEffect(() => {
        const observer = new ResizeObserver(([entry]) => setW(Math.max(240, Math.round(entry.contentRect.width))));
        observer.observe(boxRef.current);
        return () => observer.disconnect();
      }, []);

      const H = Math.round(Math.min(240, Math.max(160, W * 0.45)));
      const left = 34, right = 8, top = 8, bottom = 22;
      const plotW = W - left - right, plotH = H - top - bottom;
      const n = timeline.frame.length;
      const maxValue = Math.max(...timeline.frame, ...parts.flatMap(p => timeline[p.key]));
      // Pick a round tick step that gives at most 5 labels, even when one hitch is thousands of ms.
      const tickStep = [2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find(s => maxValue / s <= 5) || 10000;
      const yMax = Math.max(tickStep, Math.ceil(maxValue / tickStep) * tickStep);

      const x = i => left + (n === 1 ? 0 : (i / (n - 1)) * plotW);
      const y = ms => top + plotH - (ms / yMax) * plotH;
      const path = values => values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

      const ticks = [];
      for (let t = 0; t <= yMax; t += tickStep) ticks.push(t);
      const target60 = 1000 / 60;  // 16.7 ms = 60 FPS

      function onMove(event) {
        const box = svgRef.current.getBoundingClientRect();
        const svgX = ((event.clientX - box.left) / box.width) * W;
        const i = Math.round(((svgX - left) / plotW) * (n - 1));
        setHover(Math.max(0, Math.min(n - 1, i)));
      }

      const series = [{ key: "frame", name: "Frame", color: "var(--s-frame)" }, ...parts];

      return (
        <>
          <div className="legend">
            {series.map(s => (
              <span key={s.key}><span className="line-key" style={{ background: s.color }} />{s.name.replace(" (CPU)", "")}</span>
            ))}
            {target60 <= yMax && <span><span className="line-key" style={{ borderTop: "2px dashed var(--muted)", height: 0 }} />60 FPS</span>}
          </div>
          <div className="chart" ref={boxRef}>
            <svg ref={svgRef} width={W} height={H} viewBox={`0 0 ${W} ${H}`} onPointerMove={onMove} onPointerLeave={() => setHover(null)}
                 role="img" aria-label="Line chart of frame time and per-part times across the capture, in milliseconds">
              {ticks.map(t => (
                <g key={t}>
                  <line x1={left} x2={W - right} y1={y(t)} y2={y(t)} stroke="var(--grid)" strokeWidth="1" />
                  <text x={left - 6} y={y(t) + 4} textAnchor="end">{t}</text>
                </g>
              ))}
              <text x={left} y={H - 5}>start (ms ↑)</text>
              <text x={W - right} y={H - 5} textAnchor="end">end</text>

              {target60 <= yMax && (
                <line x1={left} x2={W - right} y1={y(target60)} y2={y(target60)}
                      stroke="var(--muted)" strokeWidth="1" strokeDasharray="4 4" />
              )}

              {parts.map(p => (
                <path key={p.key} d={path(timeline[p.key])} fill="none" stroke={p.color} strokeWidth="1.5"
                      strokeLinejoin="round" strokeLinecap="round" />
              ))}
              <path d={path(timeline.frame)} fill="none" stroke="var(--s-frame)" strokeWidth="1.5"
                    strokeLinejoin="round" strokeLinecap="round" />

              {hover !== null && (
                <g>
                  <line x1={x(hover)} x2={x(hover)} y1={top} y2={top + plotH} stroke="var(--muted)" strokeWidth="1" />
                  {series.map(s => (
                    <circle key={s.key} cx={x(hover)} cy={y(timeline[s.key][hover])} r="3.5"
                            fill={s.color} stroke="var(--card)" strokeWidth="2" />
                  ))}
                </g>
              )}
              {/* Invisible rectangle so the whole plot area catches the pointer. */}
              <rect x={left} y={top} width={plotW} height={plotH} fill="transparent" />
            </svg>

            {hover !== null && (
              <div className="tooltip" style={x(hover) > W / 2
                  ? { right: `${((W - x(hover)) / W) * 100 + 1}%` }
                  : { left: `${(x(hover) / W) * 100 + 1}%` }}>
                <b>Frame #{timeline.frame_index[hover]}</b>
                {series.map(s => (
                  <div key={s.key}>
                    <span className="swatch" style={{ background: s.color }} />
                    {s.name.replace(" (CPU)", "")}: {timeline[s.key][hover].toFixed(2)} ms
                  </div>
                ))}
              </div>
            )}
          </div>
          <p className="hint">Hover to inspect a frame. The line just under "Frame" is the bottleneck; spikes are hitches.</p>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
